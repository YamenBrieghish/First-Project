<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    />
  </head>
  <body>
    <nav class="navbar bg-body-tertiary mb-4" data-bs-theme="dark">
      <div class="container-fluid">
        <span class="navbar-brand mb-1 h1">Expense Tracker</span>
        <div class="dropdown d-flex align-items-center px-5">
          <button
            class="btn btn-secondary dropdown-toggle gap-2"
            type="button"
            id="themeDropdown"
            data-bs-toggle="dropdown"
            aria-expanded="false"
          >
            <i class="bi bi-circle-half theme-icon-active"></i>
          </button>
          <ul class="dropdown-menu" aria-labelledby="themeDropdown">
            <li>
              <button
                type="button"
                class="dropdown-item d-flex align-items-center gap-2"
                data-bs-theme-value="light"
              >
                <i class="bi bi-sun-fill"></i> Light
              </button>
            </li>
            <li>
              <button
                type="button"
                class="dropdown-item d-flex align-items-center gap-2"
                data-bs-theme-value="dark"
              >
                <i class="bi bi-moon-stars-fill"></i> Dark
              </button>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container">
      <div
        id="error-alert"
        class="alert alert-danger d-none"
        role="alert"
      ></div>
      <div id="loading-spinner" class="text-center my-3 d-none">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
      </div>

      <div class="summary-cards text-center">
        <div class="card shadow-sm h-100 py-1">
          <div class="card-body">
            <p class="text-body-secondary mb-1">Total</p>
            <h2 id="total-amount" class="fw-bold">0.00</h2>
          </div>
        </div>
        <div class="card shadow-sm h-100 py-1">
          <div class="card-body">
            <p class="text-body-secondary mb-1">Number of expenses</p>
            <h2 id="expense-count" class="fw-bold">0</h2>
          </div>
        </div>
        <div class="card shadow-sm h-100 py-1">
          <div class="card-body">
            <p class="text-body-secondary mb-1">Highest expense</p>
            <h2 id="highest-amount" class="fw-bold mb-0">0.00</h2>
            <small id="highest-title" class="text-body-secondary">-</small>
          </div>
        </div>
      </div>

      <div class="card shadow-sm mb-4">
        <div class="card-body">
          <h5 class="card-title mb-3">Add expense</h5>
          <form id="add-form" class="row g-3 align-items-end">
            <div class="col-md-4">
              <label class="form-label">Title</label>
              <input
                type="text"
                id="add-title"
                class="form-control"
                required
                placeholder="Lunch"
              />
            </div>
            <div class="col-md-2">
              <label class="form-label">Amount</label>
              <input
                type="number"
                id="add-amount"
                class="form-control"
                step="0.01"
                min="0.01"
                required
                placeholder="4.50"
              />
            </div>
            <div class="col-md-3">
              <label class="form-label">Category</label>
              <select id="add-category" class="form-select" required>
                <option value="" selected disabled>Choose...</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Bills">Bills</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div class="col-md-3">
              <label class="form-label">Date</label>
              <input type="date" id="add-date" class="form-control" required />
            </div>
            <div class="col-md-2">
              <button type="submit" class="btn btn-primary">Add expense</button>
            </div>
          </form>
        </div>
      </div>

      <div class="card shadow-sm mb-5">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="card-title m-0">Expenses</h5>
            <div class="d-flex align-items-center">
              <label class="me-2 text-body-secondary">Category</label>
              <select
                id="category-filter"
                class="form-select form-select-sm"
                style="width: auto"
              >
                <option value="All">All</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Bills">Bills</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>
              </select>
            </div>
          </div>
          <div class="table-responsive">
            <table class="table align-middle">
              <thead>
                <tr>
                  <th class="col-md-3">Title</th>
                  <th class="col-md-1">Amount</th>
                  <th class="col-md-3">Category</th>
                  <th class="col-md-3">Date</th>
                  <th class="text-end">Actions</th>
                </tr>
              </thead>
              <tbody id="expenses-table-body"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="editModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <form id="edit-form">
            <div class="modal-header">
              <h5 class="modal-title">Edit expense</h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
              ></button>
            </div>
            <div class="modal-body">
              <input type="hidden" id="edit-id" />

              <div class="mb-3">
                <label class="form-label">Title</label>
                <input
                  type="text"
                  id="edit-title"
                  class="form-control"
                  required
                />
              </div>
              <div class="mb-3">
                <label class="form-label">Amount</label>
                <input
                  type="number"
                  id="edit-amount"
                  class="form-control"
                  step="0.01"
                  min="0.01"
                  required
                />
              </div>
              <div class="mb-3">
                <label class="form-label">Category</label>
                <select id="edit-category" class="form-select" required>
                  <option value="Food">Food</option>
                  <option value="Transport">Transport</option>
                  <option value="Bills">Bills</option>
                  <option value="Entertainment">Entertainment</option>
                  <option value="Other">Other</option>
                </select>
              </div>
              <div class="mb-3">
                <label class="form-label">Date</label>
                <input
                  type="date"
                  id="edit-date"
                  class="form-control"
                  required
                />
              </div>
            </div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-light border"
                data-bs-dismiss="modal"
              >
                Cancel
              </button>
              <button type="submit" class="btn btn-primary">
                Save changes
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
